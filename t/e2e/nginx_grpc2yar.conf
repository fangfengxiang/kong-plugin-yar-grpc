# nginx_grpc2yar.conf — Scenario 2: Go gRPC → Kong (grpc2yar) → PHP Yar
#
# OpenResty listens on @PORT_KONG_GRPC2YAR@ (HTTP/2), receives gRPC requests,
# the Kong plugin handler delegates to grpc2yar_endpoint.serve() which converts
# to YAR protocol and calls the PHP Yar server (@PORT_PHP@).
#
# Variables $grpc_status/$grpc_message are declared in the location block for
# the bridge entry module to write via ngx.var.grpc_status. add_trailer sends
# HTTP/2 gRPC trailers.

daemon off;
worker_processes 1;
pid @RUN@/nginx-kong-grpc2yar.pid;
error_log @RUN@/logs/nginx-kong-grpc2yar_error.log info;

events {
    worker_connections 64;
}

http {
    # Kong plugin source + bridge source lib (mounted at /bridge at runtime)
    lua_package_path "@PREFIX@/?.lua;@BRIDGE_LIB@/?.lua;@BRIDGE_LIB@/?/init.lua;;";
    client_body_buffer_size 2m;
    client_body_temp_path @RUN@/client_body_temp_grpc2yar;
    access_log @RUN@/logs/nginx-kong-grpc2yar_access.log;

    server {
        listen @PORT_KONG_GRPC2YAR@;
        http2 on;
        client_max_body_size 10m;

        location / {
            # Variables for bridge entry module (set must be in location context)
            set $grpc_status "0";
            set $grpc_message "";

            # gRPC trailers (HTTP/2 responses only)
            add_trailer grpc-status $grpc_status always;
            add_trailer grpc-message $grpc_message always;

            content_by_lua_block {
                local handler = require("kong.plugins.yar_grpc_bridge.handler")
                handler:access({
                    direction = "grpc2yar",
                    services = {
                        ["calculator.Calculator"] = {
                            proto = "@PREFIX@/t/e2e/proto/calculator.pb",
                            url = "http://127.0.0.1:@PORT_PHP@/api.php",
                            options = { packager = "@PACKAGER@", timeout = "5000" },
                        },
                    },
                    yar_options = { timeout = "3000" },
                    max_payload_bytes = 8388608,
                })
            }
        }
    }
}
